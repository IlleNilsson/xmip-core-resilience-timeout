[package]
name = "xmip-core-resilience-timeout"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-resilience-timeout"
description = "Timeout guard: an attempt that took longer than its limit is refused, even one that succeeded, unless the guard is lenient. A xmip-core-resilience technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
resilience = { package = "xmip-core-resilience", git = "https://github.com/IlleNilsson/xmip-core-resilience", branch = "main" }

[dev-dependencies]
# The failure a test hands the guard.
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[lints]
workspace = true
